<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  <meta name="theme-color" content="#05070e">
  <meta name="keywords" content="portfolio, developer, software engineer, full stack, real-time systems, 1337, 42 network">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  {% if page.image %}<meta property="og:image" content="{{ site.url }}{{ page.image }}">{% endif %}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{{ site.description }}">
</head>
<body>
  <!-- Background layers -->
  <div class="bg-fx"></div>
  <div class="bg-grid"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- Navigation -->
  <header id="header">
    <nav>
      <a href="{{ '/' | relative_url }}" class="logo">&lt;<b>mizem</b>/<span class="dot">&gt;</span></a>
      <ul class="nav-links">
        <li><a href="#about">about</a></li>
        <li><a href="#skills">skills</a></li>
        <li><a href="#projects">projects</a></li>
        <li><a href="#contact">contact</a></li>
        <li><a href="https://github.com/Mizemm" target="_blank" rel="noopener" class="nav-cta">GitHub ↗</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="container footer-inner">
      <span>© {{ site.time | date: '%Y' }} {{ site.title }} — built from scratch.</span>
      <div class="footer-links">
        <a href="https://github.com/Mizemm" target="_blank" rel="noopener" class="social-btn">GitHub</a>
        <a href="https://www.linkedin.com/in/mizemm/" target="_blank" rel="noopener" class="social-btn">LinkedIn</a>
      </div>
    </div>
  </footer>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    // Navbar background on scroll
    const header = document.getElementById('header');
    const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 40);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });

    // Smooth scroll for in-page anchors
    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener('click', e => {
        const t = document.querySelector(a.getAttribute('href'));
        if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      });
    });

    // Cursor glow
    const glow = document.getElementById('cursorGlow');
    if (window.matchMedia('(pointer: fine)').matches) {
      window.addEventListener('mousemove', e => {
        glow.style.opacity = '1';
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
      });
    }

    // Scroll reveal
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));

    // Active nav link on scroll-spy
    const sections = document.querySelectorAll('section[id]');
    const links = document.querySelectorAll('.nav-links a[href^="#"]');
    window.addEventListener('scroll', () => {
      let cur = '';
      sections.forEach(s => { if (scrollY >= s.offsetTop - 160) cur = s.id; });
      links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + cur));
    }, { passive: true });

    // Animated stat counters
    const counters = document.querySelectorAll('[data-count]');
    const cio = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        const el = en.target, target = parseFloat(el.dataset.count), suffix = el.dataset.suffix || '';
        let start = 0; const dur = 1400, t0 = performance.now();
        const tick = (t) => {
          const p = Math.min((t - t0) / dur, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = (Number.isInteger(target) ? Math.round(eased * target) : (eased * target).toFixed(1)) + suffix;
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        cio.unobserve(el);
      });
    }, { threshold: 0.5 });
    counters.forEach(c => cio.observe(c));

    // Typing effect
    const typeEl = document.getElementById('typed');
    if (typeEl) {
      const roles = JSON.parse(typeEl.dataset.roles);
      let ri = 0, ci = 0, deleting = false;
      const span = typeEl.querySelector('.txt');
      const loop = () => {
        const word = roles[ri];
        span.textContent = word.slice(0, ci);
        if (!deleting && ci < word.length) { ci++; setTimeout(loop, 70); }
        else if (!deleting && ci === word.length) { deleting = true; setTimeout(loop, 1600); }
        else if (deleting && ci > 0) { ci--; setTimeout(loop, 35); }
        else { deleting = false; ri = (ri + 1) % roles.length; setTimeout(loop, 300); }
      };
      loop();
    }

    // 3D tilt on cards
    if (window.matchMedia('(pointer: fine)').matches) {
      document.querySelectorAll('.tilt').forEach(card => {
        card.addEventListener('mousemove', e => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5;
          const y = (e.clientY - r.top) / r.height - 0.5;
          card.style.transform = `perspective(900px) rotateY(${x * 6}deg) rotateX(${-y * 6}deg) translateY(-8px)`;
        });
        card.addEventListener('mouseleave', () => { card.style.transform = ''; });
      });
    }
  });
  </script>
</body>
</html>
